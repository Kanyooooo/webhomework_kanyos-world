<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kanyo 的像素 CTF 终端模块。">
    <title>Kanyo Pixel Terminal</title>
    <style>
        :root {
            --paper: #f4f4ef;
            --ink: #060606;
            --muted: #696962;
            --lime: #b7ff2a;
            --pink: #ff6aa2;
            --red: #ff2d2d;
            --line: #080808;
            --dot: rgba(0, 0, 0, 0.08);
            --mono: "Courier New", "SFMono-Regular", Consolas, monospace;
            --sans: Arial, Helvetica, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html {
            background: var(--paper);
            color: var(--ink);
        }

        body {
            min-width: 320px;
            min-height: 100svh;
            margin: 0;
            overflow-x: hidden;
            background:
                radial-gradient(var(--dot) 1px, transparent 1px),
                var(--paper);
            background-size: 4px 4px;
            font-family: var(--mono);
            image-rendering: pixelated;
        }

        a,
        button,
        input {
            color: inherit;
            font: inherit;
        }

        a {
            text-decoration: none;
        }

        button {
            border-radius: 0;
            cursor: pointer;
        }

        .paper-noise,
        .scanline {
            position: fixed;
            inset: 0;
            z-index: 30;
            pointer-events: none;
        }

        .paper-noise {
            opacity: 0.12;
            background-image: repeating-linear-gradient(90deg, #000 0 1px, transparent 1px 6px);
        }

        .scanline {
            opacity: 0.08;
            background-image: repeating-linear-gradient(0deg, transparent 0 3px, #000 3px 4px);
        }

        .terminal-topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            height: 86px;
            display: grid;
            grid-template-columns: 58px 1fr auto auto;
            align-items: center;
            gap: 22px;
            padding: 20px clamp(18px, 4vw, 60px);
            border-bottom: 1px solid var(--line);
            background: rgba(244, 244, 239, 0.9);
        }

        .flag-mark {
            position: relative;
            width: 34px;
            height: 46px;
        }

        .flag-mark::before {
            content: "";
            position: absolute;
            left: 4px;
            top: 0;
            width: 4px;
            height: 44px;
            background: var(--line);
        }

        .flag-mark span {
            position: absolute;
            left: 8px;
            top: 6px;
            width: 24px;
            height: 18px;
            background: var(--lime);
            clip-path: polygon(0 0, 100% 20%, 72% 58%, 100% 100%, 0 80%);
            box-shadow: 3px 3px 0 var(--line);
        }

        .login-state {
            color: var(--red);
            font-size: 12px;
        }

        .terminal-topbar nav {
            display: flex;
            gap: 28px;
            font-weight: 700;
        }

        .mode-box {
            min-width: 126px;
            padding: 8px 12px;
            border: 1px solid var(--line);
            text-align: center;
        }

        .mode-box span,
        .mode-box strong {
            display: block;
            font-size: 12px;
        }

        .mode-box strong::before {
            content: "1 // ";
        }

        .terminal-shell {
            min-height: calc(100svh - 86px);
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(320px, 0.38fr);
            border-bottom: 1px solid var(--line);
        }

        .terminal-board,
        .side-board {
            position: relative;
            padding: 74px clamp(18px, 4vw, 54px) 34px;
        }

        .terminal-board {
            border-right: 1px solid var(--line);
        }

        .panel-title {
            position: absolute;
            left: 18px;
            top: 18px;
            font-size: 13px;
        }

        .terminal-output {
            min-height: 64svh;
            max-height: 64svh;
            overflow: auto;
            border: 1px solid var(--line);
            background:
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                #111;
            background-size: 18px 18px;
            color: var(--paper);
            padding: 18px;
            line-height: 1.58;
        }

        .terminal-output p {
            margin: 0 0 8px;
            white-space: pre-wrap;
        }

        .terminal-output .muted {
            color: #aaa;
        }

        .terminal-output .ok {
            color: var(--lime);
        }

        .terminal-output .pink {
            color: var(--pink);
        }

        .prompt-row {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            min-height: 56px;
            margin-top: 14px;
            border: 1px solid var(--line);
            background: var(--paper);
        }

        .prompt-label {
            padding: 0 14px;
            color: var(--red);
        }

        #command-input {
            min-width: 0;
            height: 54px;
            border: 0;
            outline: 0;
            background: transparent;
        }

        #run-command {
            height: 56px;
            padding: 0 18px;
            border: 0;
            border-left: 1px solid var(--line);
            background: transparent;
        }

        #run-command:hover,
        .quick-command:hover,
        .track-button:hover {
            background: var(--ink);
            color: var(--paper);
        }

        .quick-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            margin-top: 14px;
            border-left: 1px solid var(--line);
            border-top: 1px solid var(--line);
        }

        .quick-command {
            min-height: 46px;
            border: 0;
            border-right: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            background: transparent;
        }

        .side-board {
            display: grid;
            gap: 24px;
            align-content: start;
        }

        .pixel-album {
            position: relative;
            aspect-ratio: 1;
            border: 1px solid var(--line);
            background:
                linear-gradient(90deg, rgba(0, 0, 0, 0.12) 1px, transparent 1px),
                linear-gradient(rgba(0, 0, 0, 0.12) 1px, transparent 1px),
                var(--paper);
            background-size: 14px 14px;
            overflow: hidden;
        }

        .pixel-album img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(1) contrast(1.28);
            mix-blend-mode: multiply;
        }

        .pixel-album::after {
            content: "";
            position: absolute;
            right: 20px;
            bottom: 20px;
            width: 72px;
            height: 72px;
            background:
                linear-gradient(90deg, var(--line) 0 7px, transparent 7px),
                linear-gradient(var(--lime), var(--lime));
            background-size: 100% 100%, 48px 32px;
            background-position: 0 0, 8px 4px;
            background-repeat: no-repeat;
            clip-path: polygon(0 0, 100% 8%, 72% 48%, 100% 86%, 0 74%);
            filter: drop-shadow(5px 5px 0 var(--line));
        }

        .now-playing {
            display: grid;
            gap: 8px;
        }

        .now-playing span {
            color: var(--muted);
            font-size: 13px;
        }

        .now-playing strong {
            font-family: var(--sans);
            font-size: clamp(1.7rem, 3vw, 3rem);
            line-height: 0.95;
        }

        .track-list {
            display: grid;
            border-left: 1px solid var(--line);
            border-top: 1px solid var(--line);
        }

        .track-button {
            min-height: 48px;
            display: grid;
            grid-template-columns: 42px 1fr;
            align-items: center;
            gap: 12px;
            border: 0;
            border-right: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            background: transparent;
            text-align: left;
            padding: 0 12px;
        }

        .track-button.is-playing {
            background: var(--lime);
            color: var(--ink);
        }

        .meter {
            display: grid;
            grid-template-columns: repeat(24, 1fr);
            gap: 3px;
            min-height: 54px;
            align-items: end;
        }

        .meter i {
            display: block;
            height: 8px;
            background: var(--ink);
            transition: height 0.12s linear, background 0.12s linear;
        }

        .terminal-footer {
            padding: 24px clamp(18px, 4vw, 60px);
            color: var(--muted);
            font-size: 13px;
        }

        @media (max-width: 900px) {
            .terminal-topbar {
                height: 72px;
                grid-template-columns: 42px 1fr auto;
            }

            .terminal-topbar nav,
            .mode-box {
                display: none;
            }

            .terminal-shell {
                grid-template-columns: 1fr;
            }

            .terminal-board {
                border-right: 0;
                border-bottom: 1px solid var(--line);
            }

            .terminal-output {
                min-height: 54svh;
                max-height: 54svh;
            }

            .quick-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .prompt-row {
                grid-template-columns: 1fr auto;
            }

            .prompt-label {
                grid-column: 1 / -1;
                padding: 10px 12px 0;
            }
        }
    </style>
</head>
<body>
    <div class="paper-noise" aria-hidden="true"></div>
    <div class="scanline" aria-hidden="true"></div>

    <header class="terminal-topbar">
        <a class="flag-mark" href="index.html" aria-label="返回主页"><span></span></a>
        <div class="login-state">[ shell obtained ]</div>
        <nav aria-label="终端导航">
            <a href="index.html#zone">Zone</a>
            <a href="index.html#works">Adventure</a>
            <a href="index.html#lab">Misc Lab</a>
        </nav>
        <div class="mode-box">
            <span>TERMINAL</span>
            <strong>PIXEL</strong>
        </div>
    </header>

    <main class="terminal-shell">
        <section class="terminal-board">
            <div class="panel-title">/dev/kanyo // PIXEL SHELL</div>
            <div class="terminal-output" id="terminal-output" aria-live="polite"></div>

            <form class="prompt-row" id="command-form">
                <span class="prompt-label">kanyo@restricted-zone:$</span>
                <input id="command-input" autocomplete="off" spellcheck="false" aria-label="输入终端命令">
                <button id="run-command" type="submit">run</button>
            </form>

            <div class="quick-grid" aria-label="快捷命令">
                <button class="quick-command" type="button" data-command="help">help</button>
                <button class="quick-command" type="button" data-command="ls">ls</button>
                <button class="quick-command" type="button" data-command="cat route.txt">route</button>
                <button class="quick-command" type="button" data-command="play 05">play 05</button>
            </div>
        </section>

        <aside class="side-board">
            <div class="panel-title">MUSIC // KESSOKU CACHE</div>
            <div class="pixel-album">
                <img src="assets/music/image.png" alt="Kessoku Band album">
            </div>
            <div class="now-playing">
                <span>NOW PLAYING</span>
                <strong id="track-title">no track loaded</strong>
                <span id="track-meta">try: play 05</span>
            </div>
            <div class="meter" id="meter" aria-hidden="true"></div>
            <div class="track-list" id="track-list"></div>
        </aside>
    </main>

    <footer class="terminal-footer">
        commands: help / ls / cat about.txt / cat route.txt / play 01 / stop / clear / home
    </footer>

    <audio id="audio"></audio>

    <script>
        const output = document.querySelector('#terminal-output');
        const form = document.querySelector('#command-form');
        const input = document.querySelector('#command-input');
        const trackTitle = document.querySelector('#track-title');
        const trackMeta = document.querySelector('#track-meta');
        const trackList = document.querySelector('#track-list');
        const meter = document.querySelector('#meter');
        const audio = document.querySelector('#audio');

        const tracks = [
            { id: '01', file: '【中日字幕】孤独摇滚 歌曲27首 全部收录 - 1.青春コンプレックス (青春症候群)(Av559996788,P1).mp3', title: '青春コンプレックス' },
            { id: '03', file: '【中日字幕】孤独摇滚 歌曲27首 全部收录 - 3.Distortion!! (失真!!)(Av559996788,P3).mp3', title: 'Distortion!!' },
            { id: '05', file: '【中日字幕】孤独摇滚 歌曲27首 全部收录 - 5.ギターと孤独と蒼い惑星 (吉他与孤独与蓝色星球)(Av559996788,P5).mp3', title: '吉他与孤独与蓝色星球' },
            { id: '07', file: '【中日字幕】孤独摇滚 歌曲27首 全部收录 - 7.あのバンド（那个乐队）(Av559996788,P7).mp3', title: '那个乐队' },
            { id: '12', file: '【中日字幕】孤独摇滚 歌曲27首 全部收录 - 12.星座になれたら（若能化作星座）(Av559996788,P12).mp3', title: '若能化作星座' }
        ];

        const files = {
            'about.txt': [
                'NAME: Kanyo',
                'CLASS: pwn / web / misc / motion',
                'STATUS: shell is fake, attitude is real',
                '',
                '把页面做成一段能进去的东西，而不是一份自我介绍。'
            ].join('\n'),
            'route.txt': [
                '00 pwn: leak libc, find /bin/sh',
                '01 asm: walk through cmp / jmp / call',
                '02 web: cookie, xss, sql, waf',
                '03 misc: qr, lsb, base64, zip password',
                '',
                'goal: flag{make_it_feel_handmade}'
            ].join('\n')
        };

        let activeTrack = null;
        let meterTimer = null;

        function print(text, className = '') {
            const line = document.createElement('p');
            if (className) line.className = className;
            line.textContent = text;
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }

        function printBlock(text, className = '') {
            text.split('\n').forEach((line) => print(line, className));
        }

        function normalizeCommand(value) {
            return value.trim().replace(/\s+/g, ' ');
        }

        function renderTracks() {
            trackList.replaceChildren();
            tracks.forEach((track) => {
                const button = document.createElement('button');
                button.className = 'track-button';
                button.type = 'button';
                button.dataset.track = track.id;
                button.innerHTML = `<span>${track.id}</span><strong>${track.title}</strong>`;
                button.addEventListener('click', () => runCommand(`play ${track.id}`));
                trackList.appendChild(button);
            });
        }

        function setActiveTrack(track) {
            activeTrack = track;
            trackTitle.textContent = track ? track.title : 'no track loaded';
            trackMeta.textContent = track ? `track ${track.id} // Kessoku Band` : 'try: play 05';
            document.querySelectorAll('.track-button').forEach((button) => {
                button.classList.toggle('is-playing', track && button.dataset.track === track.id);
            });
        }

        function startMeter() {
            if (meterTimer) return;
            meterTimer = window.setInterval(() => {
                document.querySelectorAll('.meter i').forEach((bar, index) => {
                    const wave = Math.sin(Date.now() / 120 + index * 0.7) * 18 + 20;
                    const noise = Math.random() * 38;
                    bar.style.height = `${Math.max(6, wave + noise)}px`;
                    bar.style.background = index % 5 === 0 ? 'var(--lime)' : 'var(--ink)';
                });
            }, 120);
        }

        function stopMeter() {
            window.clearInterval(meterTimer);
            meterTimer = null;
            document.querySelectorAll('.meter i').forEach((bar) => {
                bar.style.height = '8px';
                bar.style.background = 'var(--ink)';
            });
        }

        async function playTrack(track) {
            audio.src = `assets/music/${encodeURIComponent(track.file)}`;
            try {
                await audio.play();
                setActiveTrack(track);
                startMeter();
                print(`now playing: ${track.id} ${track.title}`, 'ok');
            } catch (error) {
                print(`playback blocked: ${error.message}`, 'pink');
            }
        }

        function runCommand(raw) {
            const commandLine = normalizeCommand(raw);
            if (!commandLine) return;

            print(`$ ${commandLine}`, 'muted');
            const [command, arg] = commandLine.split(' ');

            if (command === 'help') {
                printBlock('help\nls\ncat about.txt\ncat route.txt\nplay 01\nplay 03\nplay 05\nstop\nclear\nhome', 'ok');
                return;
            }

            if (command === 'ls') {
                printBlock('about.txt\nroute.txt\nmusic/01\nmusic/03\nmusic/05\nmusic/07\nmusic/12', 'ok');
                return;
            }

            if (command === 'cat') {
                if (files[arg]) {
                    printBlock(files[arg]);
                } else {
                    print(`cat: ${arg || 'missing'}: no such file`, 'pink');
                }
                return;
            }

            if (command === 'play') {
                const track = tracks.find((item) => item.id === arg);
                if (!track) {
                    print(`play: ${arg || 'missing'}: choose 01 / 03 / 05 / 07 / 12`, 'pink');
                    return;
                }
                playTrack(track);
                return;
            }

            if (command === 'stop') {
                audio.pause();
                stopMeter();
                print('playback stopped. Bocchi can breathe now.', 'ok');
                return;
            }

            if (command === 'clear') {
                output.replaceChildren();
                return;
            }

            if (command === 'home') {
                window.location.href = 'index.html';
                return;
            }

            print(`${command}: command not found. try help`, 'pink');
        }

        form.addEventListener('submit', (event) => {
            event.preventDefault();
            runCommand(input.value);
            input.value = '';
        });

        document.querySelectorAll('.quick-command').forEach((button) => {
            button.addEventListener('click', () => runCommand(button.dataset.command));
        });

        audio.addEventListener('pause', stopMeter);
        audio.addEventListener('ended', stopMeter);

        for (let i = 0; i < 24; i += 1) {
            const bar = document.createElement('i');
            meter.appendChild(bar);
        }

        renderTracks();
        print('restricted pixel shell ready.', 'ok');
        print('type help, or click a command. no fake hacker rain today.', 'muted');
        input.focus();
    </script>
</body>
</html>
